name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (crew, live report, security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: uv sync --project backend --locked --group crew
      # Tests that need the private historical catalogue skip themselves; the AI crew, the live report service and
      # the security layer run fully against fixtures, with no network and no model calls.
      - name: Pytest
        run: uv run --project backend pytest backend/tests -q -k "crew or live_crew or security"

  web:
    name: Web type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web exec tsc -- -b
      - run: npm --prefix web run build
